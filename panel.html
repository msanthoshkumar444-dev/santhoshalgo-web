<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SanthoshAlgo — Control Panel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap');

:root {
  --bg:      #080b0f;
  --bg2:     #0d1117;
  --bg3:     #111820;
  --bg4:     #161f2a;
  --border:  #1a2535;
  --border2: #223044;
  --text:    #c9d8e8;
  --text2:   #6b8499;
  --text3:   #3d5266;
  --green:   #00e5a0;
  --red:     #ff4d6d;
  --blue:    #3d9bff;
  --amber:   #ffb626;
  --purple:  #a78bfa;
  --green-bg: rgba(0,229,160,.07);
  --red-bg:   rgba(255,77,109,.07);
  --blue-bg:  rgba(61,155,255,.07);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: .4;
}

.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8,11,15,.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 52px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: -0.5px; }
.logo span { color: var(--green); }
.logo em { color: var(--text2); font-style: normal; font-size: 11px; margin-left: 8px; font-family: 'JetBrains Mono', monospace; font-weight: 400; }
.nav { display: flex; gap: 4px; }
.nav a {
  padding: 5px 14px; border-radius: 6px;
  font-size: 11px; color: var(--text3); text-decoration: none;
  transition: all .15s;
}
.nav a:hover { color: var(--text2); background: var(--bg3); }
.nav a.active { color: var(--green); background: var(--green-bg); }
.server-badge {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px;
  border: 1px solid var(--border2);
  font-size: 11px; color: var(--text2);
  background: var(--bg2);
}
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.live-dot.on  { animation: pulse 2s infinite; box-shadow: 0 0 6px var(--green); }
.live-dot.off { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

.page { max-width: 1280px; margin: 0 auto; padding: 24px 28px; position: relative; z-index: 1; }

.section-header {
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 14px;
}
.section-num { font-family: 'Syne', sans-serif; font-size: 11px; color: var(--green); opacity: .6; }
.section-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text2); }

.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 22px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border2), transparent);
}

.empty {
  text-align: center; padding: 60px 40px; color: var(--text3); font-size: 12px;
}
.empty-icon { font-size: 40px; margin-bottom: 14px; }
.empty-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
.empty-sub { font-size: 11px; color: var(--text3); line-height: 1.8; }
.coming-soon {
  display: inline-block; margin-top: 16px;
  padding: 5px 14px; border-radius: 6px;
  border: 1px solid var(--border2);
  font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 1.5px;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Santhos<span>Algo</span> <em>/ panel</em></div>
  <nav class="nav">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/status.html">Status</a>
    <a href="/panel.html" class="active">Panel</a>
    <a href="/backtest.html">Backtester</a>
  </nav>
  <div class="server-badge">
    <div class="live-dot off" id="statusDot"></div>
    <span id="statusText">Connecting...</span>
  </div>
</div>

<div class="page">
  <div class="section-header">
    <span class="section-num">01</span>
    <span class="section-title">Control Panel</span>
  </div>
  <div class="card">
    <div class="empty">
      <div class="empty-icon">&#9881;</div>
      <div class="empty-title">Control Panel</div>
      <div class="empty-sub">
        Manual trade controls, strategy management,<br>
        and server configuration will appear here.
      </div>
      <span class="coming-soon">Coming Soon</span>
    </div>
  </div>
</div>

<script>
const SERVER = 'https://santhoshalgo.online';
async function ping() {
  try {
    const res = await fetch(SERVER + '/status', { signal: AbortSignal.timeout(8000) });
    const d = await res.json();
    document.getElementById('statusDot').className = 'live-dot on';
    document.getElementById('statusText').textContent = 'Online — Nifty ' + (d.nifty_spot || '--');
  } catch(e) {
    document.getElementById('statusDot').className = 'live-dot off';
    document.getElementById('statusText').textContent = 'Offline';
  }
}
ping();
</script>
</body>
</html>
